[package]
name = "rucrf"
version = "0.4.0"
edition = "2021"
rust-version = "1.88"
authors = ["Koichi Akabe <vbkaisetsu@gmail.com>"]
description = "Conditional Random Fields implemented in pure Rust"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/daac-tools/rucrf"
repository = "https://github.com/daac-tools/rucrf"
readme = "README.md"
keywords = ["crf"]
categories = ["science", "algorithms", "no-std"]

[dependencies]
serde = { version = "1", default-features = false, features = ["alloc", "derive"] } # MIT or Apache-2.0
hashbrown = "0.17" # MIT or Apache-2.0

argmin = { version = "0.11.0", optional = true } # MIT or Apache-2.0
argmin-math = { version = "0.5.1", optional = true } # MIT or Apache-2.0
argmin-observer-slog = { version = "0.2.0", optional = true } # MIT or Apache-2.0
crossbeam-channel = { version = "0.5.17", optional = true } # MIT or Apache-2.0

[features]
default = ["train"]
alloc = []
std = ["alloc"]
train = ["std", "argmin", "argmin-math", "argmin-observer-slog", "crossbeam-channel"]
